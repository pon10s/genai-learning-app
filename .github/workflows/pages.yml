# GitHub Pages 自動デプロイ
# main ブランチに push されるたびに、src/ フォルダの中身をWebサイトとしてHTML公開する。
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # 手動実行も可能にする

# Pages へ書き込む権限
permissions:
  contents: read
  pages: write
  id-token: write

# 同時に走らないよう調整（最新の1つだけ反映）
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Pages の設定
        uses: actions/configure-pages@v5

      - name: 公開する中身（src/）をまとめる
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./src

      - name: 公開する
        id: deployment
        uses: actions/deploy-pages@v4
